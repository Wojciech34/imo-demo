[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onedata-imo-poc"
version = "0.1.0"
description = "Standalone, evidence-driven intermediate metadata experiment"
requires-python = ">=3.10"
dependencies = ["rdflib>=7.1,<8", "lxml>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["imo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
